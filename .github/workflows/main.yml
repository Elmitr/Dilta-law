name: Python Tests & Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check imports and syntax
      run: |
        python -m py_compile src/*.py
        echo "✅ All Python files have valid syntax"
    
    - name: Run basic module tests
      run: |
        python -c "from src.database import init_db; print('✅ database.py imports successfully')"
        python -c "from src.llm_router import get_legal_response; print('✅ llm_router.py imports successfully')"
        python -c "from src.tagging import get_all_tags; print('✅ tagging.py imports successfully')"
    
    - name: Test database initialization
      run: |
        python -c "from src.database import init_db; init_db(); print('✅ Database initialized successfully')"
